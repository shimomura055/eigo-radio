name: AUTO-001 Controller App Integrated Write

# AUTO-001-05-03-03C: 検証済みのread-only planner(scripts.issue_agent_planner)と
# Controller GitHub App writer(scripts.controller_label_writer /
# scripts.controller_block_writer)を、issues:labeledの実イベントへ安全に統合する。
# agent:readyが追加された正常Issueはagent:ready -> agent:workingへ、preflight
# 不合格の不正Issueはagent:ready -> agent:blocked(+managed comment)へ遷移する。
#
# このworkflowはClaude Codeプロセスを起動しない。branch作成・commit・push・
# Pull Request作成のいずれも行わない。issues:labeledで追加されたラベルが
# agent:ready以外の場合はNOT_APPLICABLEとして成功終了し、Controller App tokenの
# 生成・GitHubへの書き込みを一切行わない。
#
# job構成:
#   plan          -- 標準GITHUB_TOKEN(read-only、contents:read / issues:read)
#                     だけを使い、scripts.issue_agent_plannerで状態遷移を判定
#                     する。Controller App tokenはこのjobでは一切生成しない。
#   writer_start  -- planがexact `WOULD_START`契約
#                     (planned_remove=[agent:ready], planned_add=[agent:working])
#                     を確認した場合だけ実行する(AUTO-001-05-03-03Aと同じ書き
#                     込み順序: 事前状態判定 -> planner再実行・計画一致確認 ->
#                     repository label前提確認 -> 書き込み直前再確認 ->
#                     Controller App token生成 -> agent:working追加・検証 ->
#                     agent:ready削除 -> 最終状態評価)。
#   writer_block  -- planがexact `WOULD_BLOCK_PREFLIGHT`契約
#                     (planned_remove=[agent:ready], planned_add=[agent:blocked],
#                     errors 1件以上)を確認した場合だけ実行する
#                     (AUTO-001-05-03-03Bと同じ書き込み順序: 事前状態判定
#                     (Issue+コメント再取得、direct validator再評価) ->
#                     planner再実行・計画一致確認 -> direct validator/planner
#                     errors完全一致確認 -> repository label前提確認 ->
#                     書き込み直前再確認 -> Controller App token生成 ->
#                     agent:blocked追加・検証 -> managed comment CREATE/UPDATE・
#                     検証 -> agent:ready削除 -> 最終状態評価)。
#
# plan job -> writer job間で渡すのは、サニタイズ済みのスカラー値
# (issue_number / decision / applicable / reason_code / writer_action /
# planned_add_label / planned_remove_label / error_count / error_fingerprint /
# contract_version)だけであり、Issue本文・raw APIレスポンス・comment本文・
# secret・tokenのいずれも渡さない。各writer jobは、この値を「実行するかどうか」
# の判定にだけ使い、実際の書き込み判断は自分自身が再取得したIssue/コメントと
# 自分自身が再実行したplanner/direct validatorの結果だけを根拠にする
# (plan jobの判定を無条件には信用しない)。
#
# 既存のread-only dry-run workflow(auto001-agent-dryrun.yml)は変更しない。
# AUTO-001-05-03-03A/03B(auto001-controller-write-check.yml /
# auto001-controller-block-check.yml)のworkflow_dispatch手動経路も維持する
# (復旧・再検証用)。この3つのController書き込みworkflow(03A/03B/統合)は、
# 同一Issueに対する並行書き込みを防ぐため、repository+Issue番号で共通の
# concurrency namespace(auto001-controller-write-<repository>-<issue_number>)
# を使用する。

on:
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      issue_number:
        description: "手動再検証の対象Issue番号(復旧・再検証用。自動経路と同じplanner・writerを通る)"
        required: true
        type: number

permissions:
  contents: read
  issues: read

concurrency:
  group: auto001-agent-integrated-plan-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number || 'unknown' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # plan: 標準GITHUB_TOKEN(read-only)だけを使う事前判定job。
  # Controller App tokenは生成しない。
  # ---------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue_number: ${{ steps.classify.outputs.issue_number }}
      decision: ${{ steps.classify.outputs.decision }}
      applicable: ${{ steps.classify.outputs.applicable }}
      reason_code: ${{ steps.classify.outputs.reason_code }}
      writer_action: ${{ steps.classify.outputs.writer_action }}
      planned_add_label: ${{ steps.classify.outputs.planned_add_label }}
      planned_remove_label: ${{ steps.classify.outputs.planned_remove_label }}
      error_count: ${{ steps.classify.outputs.error_count }}
      error_fingerprint: ${{ steps.classify.outputs.error_fingerprint }}
      contract_version: ${{ steps.classify.outputs.contract_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate issue_number input format (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          ISSUE_NUMBER_INPUT: ${{ inputs.issue_number }}
        run: |
          case "$ISSUE_NUMBER_INPUT" in
            ''|*[!0-9]*)
              echo "issue_numberが正の整数ではありません: $ISSUE_NUMBER_INPUT" >&2
              exit 1
              ;;
          esac

      # workflow_dispatch入力と、実際に取得できたIssueの番号が一致することを
      # ここで確認する(Issue番号不一致をController App token生成前に検出する)。
      - name: Fetch target issue and verify issue number (workflow_dispatch only, read-only)
        if: github.event_name == 'workflow_dispatch'
        id: fetch_issue
        env:
          GH_READ_TOKEN: ${{ github.token }}
          ISSUE_NUMBER_INPUT: ${{ inputs.issue_number }}
        run: |
          set -u
          if http_code=$(curl -sS -o issue_api.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER_INPUT}"); then
            curl_status=0
          else
            curl_status=$?
          fi

          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "::error::対象Issueの取得に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if line=$(python -m scripts.controller_token_check issue-read \
            --response-file issue_api.json \
            --expected-issue-number "$ISSUE_NUMBER_INPUT"); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          if [ "$status" -ne 0 ]; then
            echo "::error::取得したIssueの番号がinputs.issue_numberと一致しません"
            exit 1
          fi

      - name: Run planner (issues:labeled)
        if: github.event_name == 'issues'
        run: |
          set -u
          if python -m scripts.issue_agent_planner \
            --trigger "issues:labeled" \
            --event-json-path "$GITHUB_EVENT_PATH" \
            --machine-json-path planner_result.json; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::plannerが想定外の終了コードで終了しました(status=${status})"
            exit 1
          fi

      - name: Run planner (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -u
          if python -m scripts.issue_agent_planner \
            --trigger "workflow_dispatch" \
            --event-json-path "$GITHUB_EVENT_PATH" \
            --issue-json-path issue_api.json \
            --machine-json-path planner_result.json; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::plannerが想定外の終了コードで終了しました(status=${status})"
            exit 1
          fi

      # plannerのdecision/labelsが、writerが受理する2種類の契約
      # (WOULD_START, WOULD_BLOCK_PREFLIGHT)のどちらか正確に一致する場合だけ
      # writer_actionを設定する。実際の一致判定は既存モジュールの
      # check_planner_plan_matches_expected() / check_block_plan_matches_expected()
      # へ委譲し、ここでは再実装しない。ここから先へ渡すのはサニタイズ済みの
      # スカラー値だけであり、Issue本文・raw APIレスポンス・errorsの生メッセージ
      # 全文は含めない(errorsはcode/section/messageの固定文言のみを含む安全な
      # 構造化データであり、Issue本文由来の引用は含まない)。
      - name: Determine writer_action from planner result (sanitized outputs only)
        id: classify
        run: |
          set -u
          if plan_start_line=$(python -m scripts.controller_label_writer check-plan \
            --planner-json-path planner_result.json); then
            plan_start_ok=true
          else
            plan_start_ok=false
          fi
          echo "$plan_start_line"

          if plan_block_line=$(python -m scripts.controller_block_writer check-plan \
            --planner-json-path planner_result.json); then
            plan_block_ok=true
          else
            plan_block_ok=false
          fi
          echo "$plan_block_line"

          # planner_result.jsonの読み込み・判定処理自体の失敗(ファイル欠落・
          # JSON解析失敗・必須キー欠落)を、他のstep(precondition等)と同じ
          # 「command substitutionをifで保護してから$?を確認する」パターンで
          # 検出する。素の`out=$(...)`のままだと、既定shell(bash -eo pipefail)
          # 下でpythonが例外送出した瞬間にstepがそこで即終了し、後続の
          # reason_code保存やGITHUB_OUTPUTへの書き込みが一切行われない
          # (AUTO-001-05-03-02-R1で確認済みの構文的既知問題と同型)。
          if out=$(python - "$plan_start_ok" "$plan_block_ok" <<'PY'
          import json
          import sys

          plan_start_ok = sys.argv[1] == "true"
          plan_block_ok = sys.argv[2] == "true"

          with open("planner_result.json", encoding="utf-8") as f:
              d = json.load(f)

          decision = d["decision"]
          applicable = d["applicable"]
          issue_number = d["issue_number"]
          reason = d["reason"]
          errors = d["errors"]
          planned_add = d["planned_add_labels"]
          planned_remove = d["planned_remove_labels"]

          writer_action = "NONE"
          if decision == "WOULD_START" and plan_start_ok:
              writer_action = "START"
          elif decision == "WOULD_BLOCK_PREFLIGHT" and plan_block_ok:
              writer_action = "BLOCK"

          error_fingerprint = "NONE"
          if writer_action == "BLOCK":
              from scripts.controller_block_writer import compute_comment_fingerprint
              error_fingerprint = compute_comment_fingerprint(errors)

          print(f"issue_number={issue_number}")
          print(f"decision={decision}")
          print(f"applicable={json.dumps(applicable)}")
          print(f"reason_code={reason}")
          print(f"writer_action={writer_action}")
          print(f"planned_add_label={planned_add[0] if len(planned_add) == 1 else 'NONE'}")
          print(f"planned_remove_label={planned_remove[0] if len(planned_remove) == 1 else 'NONE'}")
          print(f"error_count={len(errors)}")
          print(f"error_fingerprint={error_fingerprint}")
          print("contract_version=AUTO-001-05-03-03C-writer-v1")
          PY
          ); then
            classify_status=0
          else
            classify_status=$?
          fi

          if [ "$classify_status" -ne 0 ]; then
            echo "::error::planner_result.jsonの読み込みまたは判定処理に失敗しました(status=${classify_status})。writerは実行しません。"
            exit 1
          fi

          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

          # decisionが「そもそも書き込みを意図しない」既知の値
          # (NOT_APPLICABLE / WOULD_BLOCK_STATE)の場合だけを成功終了とする。
          # WOULD_START / WOULD_BLOCK_PREFLIGHT(=writerへ進む意図)なのに
          # 直前のcheck-planが厳密一致で拒否した場合(writer_action=NONEの
          # まま)は、契約不一致という異常事態であり、成功扱いにはしない。
          # INTERNAL_ERRORおよびそれ以外の未知のdecision文字列も同様に失敗
          # とする。
          decision_value=$(echo "$out" | grep -oP '^decision=\K.*')
          writer_action_value=$(echo "$out" | grep -oP '^writer_action=\K.*')

          fail=false
          case "$decision_value" in
            NOT_APPLICABLE|WOULD_BLOCK_STATE)
              ;;
            WOULD_START|WOULD_BLOCK_PREFLIGHT)
              if [ "$writer_action_value" != "START" ] && [ "$writer_action_value" != "BLOCK" ]; then
                fail=true
              fi
              ;;
            *)
              fail=true
              ;;
          esac

          if [ "$fail" = "true" ]; then
            echo "::error::plannerのdecisionが未知か、writerの厳密契約に一致しません(decision=${decision_value} writer_action=${writer_action_value})。writerは実行しません。"
            exit 1
          fi

      - name: Publish job summary (fixed non-secret fields only)
        if: always()
        env:
          ISSUE_NUMBER: ${{ steps.classify.outputs.issue_number }}
          DECISION: ${{ steps.classify.outputs.decision }}
          APPLICABLE: ${{ steps.classify.outputs.applicable }}
          REASON_CODE: ${{ steps.classify.outputs.reason_code }}
          WRITER_ACTION: ${{ steps.classify.outputs.writer_action }}
          PLANNED_ADD: ${{ steps.classify.outputs.planned_add_label }}
          PLANNED_REMOVE: ${{ steps.classify.outputs.planned_remove_label }}
          ERROR_COUNT: ${{ steps.classify.outputs.error_count }}
          CONTRACT_VERSION: ${{ steps.classify.outputs.contract_version }}
        run: |
          rm -f issue_api.json planner_result.json
          {
            echo "## AUTO-001-05-03-03C planner判定結果"
            echo ""
            echo "- trigger: ${{ github.event_name }}"
            echo "- Issue番号: ${ISSUE_NUMBER:-NA}"
            echo "- decision: ${DECISION:-NA}"
            echo "- applicable: ${APPLICABLE:-NA}"
            echo "- reason_code: ${REASON_CODE:-NA}"
            echo "- writer_action: ${WRITER_ACTION:-NA} (START=agent:working経路 / BLOCK=agent:blocked経路 / NONE=writer不起動)"
            echo "- 計画中のラベル変更: 削除=${PLANNED_REMOVE:-NA} 追加=${PLANNED_ADD:-NA}"
            echo "- 契約違反件数: ${ERROR_COUNT:-NA}"
            echo "- contract_version: ${CONTRACT_VERSION:-NA}"
            echo "- Controller App token: このjobでは生成していません(標準GITHUB_TOKENのread-onlyだけを使用)"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # writer_start: planがexact WOULD_START契約を確認した場合だけ実行する。
  # AUTO-001-05-03-03A(auto001-controller-write-check.yml)と同じ書き込み
  # 順序・reason code・失敗時挙動を維持する。
  # ---------------------------------------------------------------------
  writer_start:
    needs: plan
    if: needs.plan.outputs.writer_action == 'START'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    concurrency:
      group: auto001-controller-write-${{ github.repository }}-${{ needs.plan.outputs.issue_number }}
      cancel-in-progress: false
    steps:
      - name: Verify plan/writer contract_version matches expected
        env:
          CONTRACT_VERSION_VALUE: ${{ needs.plan.outputs.contract_version }}
        run: |
          set -u
          expected="AUTO-001-05-03-03C-writer-v1"
          if [ "${CONTRACT_VERSION_VALUE:-}" != "$expected" ]; then
            echo "::error::plan jobのcontract_versionが想定外です。token生成前に停止します。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify required configuration is present
        id: config_check
        env:
          CLIENT_ID_VALUE: ${{ vars.AUTO001_CONTROLLER_APP_CLIENT_ID }}
          PRIVATE_KEY_VALUE: ${{ secrets.AUTO001_CONTROLLER_APP_PRIVATE_KEY }}
        run: |
          set -u
          client_id_present=false
          private_key_present=false
          if [ -n "${CLIENT_ID_VALUE:-}" ]; then client_id_present=true; fi
          if [ -n "${PRIVATE_KEY_VALUE:-}" ]; then private_key_present=true; fi
          unset CLIENT_ID_VALUE PRIVATE_KEY_VALUE

          if line=$(python -m scripts.controller_token_check check-config \
            --client-id-present "$client_id_present" \
            --private-key-present "$private_key_present"); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::設定検査に失敗しました(reason_code=${reason_code})"
            exit 1
          fi

      # 標準GITHUB_TOKEN(issues: read)による読み取り専用フェッチ。plannerへの
      # 入力・repository label前提確認・書き込み直前確認・write後の検証は、
      # すべてこのGET専用の読み取りだけで行い、Controller App tokenは
      # 実際のwrite API呼び出し(POST/DELETE)にだけ渡す。
      - name: Fetch current issue state and classify precondition
        id: precondition
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if http_code=$(curl -sS -o issue_snapshot.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}"); then
            curl_status=0
          else
            curl_status=$?
          fi

          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "state=NEEDS_WRITE" >> "$GITHUB_OUTPUT"
            echo "::error::初期Issue取得に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if line=$(python -m scripts.controller_label_writer classify-precondition \
            --response-file issue_snapshot.json); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          state=$(echo "$line" | grep -oP 'PRECONDITION_STATE=\K\S+' || echo "NEEDS_WRITE")
          before_ready=$(echo "$line" | grep -oP 'READY_PRESENT=\K\S+' || echo "NA")
          before_working=$(echo "$line" | grep -oP 'WORKING_PRESENT=\K\S+' || echo "NA")
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "before_ready=${before_ready}" >> "$GITHUB_OUTPUT"
          echo "before_working=${before_working}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::事前状態判定でwrite不可と判定されました(reason_code=${reason_code})"
            exit 1
          fi

      - name: Run planner and check exact write plan
        id: check_plan
        if: steps.precondition.outputs.state == 'NEEDS_WRITE'
        run: |
          set -u
          if line=$(python -m scripts.issue_agent_planner \
            --trigger workflow_dispatch \
            --event-json-path "$GITHUB_EVENT_PATH" \
            --issue-json-path issue_snapshot.json \
            --machine-json-path planner_result.json); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          if plan_line=$(python -m scripts.controller_label_writer check-plan \
            --planner-json-path planner_result.json); then
            plan_status=0
          else
            plan_status=$?
          fi
          echo "$plan_line"

          if [ "$status" -ne 0 ]; then
            # planner自体がINTERNAL_ERROR(decision=INTERNAL_ERROR)で終了した場合。
            reason_code="INTERNAL_ERROR"
          else
            reason_code=$(echo "$plan_line" | grep -oP 'REASON_CODE=\K\S+' || true)
            if [ -z "$reason_code" ]; then
              reason_code="INTERNAL_ERROR"
            fi
          fi
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ] || [ "$plan_status" -ne 0 ]; then
            echo "::error::plannerの計画が期待するwrite planと一致しません(reason_code=${reason_code})"
            exit 1
          fi

      - name: Verify repository has the agent:working label (read-only)
        id: check_repo_label
        if: steps.precondition.outputs.state == 'NEEDS_WRITE'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/labels/agent%3Aworking"); then
            curl_status=0
          else
            curl_status=$?
          fi

          if [ "$curl_status" -ne 0 ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::repository label確認の通信に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if line=$(python -m scripts.controller_label_writer check-repo-label-status \
            --http-status "$http_code"); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::repositoryにagent:workingラベルが存在しません(reason_code=${reason_code})"
            exit 1
          fi

      - name: Re-fetch issue immediately before write
        id: check_state_unchanged
        if: steps.precondition.outputs.state == 'NEEDS_WRITE'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if http_code=$(curl -sS -o issue_pre_write.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}"); then
            curl_status=0
          else
            curl_status=$?
          fi

          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::書き込み直前確認のIssue取得に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if line=$(python -m scripts.controller_label_writer check-state-unchanged \
            --before-response-file issue_snapshot.json \
            --current-response-file issue_pre_write.json); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::planner評価時点から状態ラベルが変化しています(reason_code=${reason_code})"
            exit 1
          fi

      # AC対応: 対象repositoryだけに限定し、Issues: writeだけを要求する。
      # tokenの自動失効を無効化する入力はここでは指定しない(既定で自動失効する)。
      - name: Generate Controller App write token
        id: app_write_token
        if: steps.precondition.outputs.state == 'NEEDS_WRITE'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO001_CONTROLLER_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO001_CONTROLLER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Add agent:working label and verify
        id: add_and_verify
        if: steps.precondition.outputs.state == 'NEEDS_WRITE'
        env:
          APP_TOKEN: ${{ steps.app_write_token.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if add_http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: token ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"labels":["agent:working"]}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}/labels"); then
            add_curl_status=0
          else
            add_curl_status=$?
          fi
          unset APP_TOKEN

          if [ "$add_curl_status" -ne 0 ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::add label APIの通信に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if add_line=$(python -m scripts.controller_label_writer check-add-http-status \
            --http-status "$add_http_code"); then
            add_status=0
          else
            add_status=$?
          fi
          echo "$add_line"

          if [ "$add_status" -ne 0 ]; then
            add_reason=$(echo "$add_line" | grep -oP 'REASON_CODE=\K\S+' || true)
            if [ -z "$add_reason" ]; then
              add_reason="INTERNAL_ERROR"
            fi
            echo "reason_code=${add_reason}" >> "$GITHUB_OUTPUT"
            echo "::error::agent:working追加に失敗しました(reason_code=${add_reason})"
            exit 1
          fi

          if verify_http_code=$(curl -sS -o issue_after_add.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}"); then
            verify_curl_status=0
          else
            verify_curl_status=$?
          fi

          if [ "$verify_curl_status" -ne 0 ] || [ "$verify_http_code" != "200" ]; then
            echo "reason_code=WRITE_VERIFICATION_FAILED" >> "$GITHUB_OUTPUT"
            echo "::error::add後の再取得に失敗しました(reason_code=WRITE_VERIFICATION_FAILED)"
            exit 1
          fi

          if verify_line=$(python -m scripts.controller_label_writer verify-working-present \
            --response-file issue_after_add.json); then
            verify_status=0
          else
            verify_status=$?
          fi
          echo "$verify_line"

          verify_reason=$(echo "$verify_line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$verify_reason" ]; then
            verify_reason="INTERNAL_ERROR"
          fi
          echo "reason_code=${verify_reason}" >> "$GITHUB_OUTPUT"

          if [ "$verify_status" -ne 0 ]; then
            echo "::error::add後の検証に失敗しました(reason_code=${verify_reason})"
            exit 1
          fi

      - name: Remove agent:ready label
        id: remove_label
        if: steps.precondition.outputs.state == 'NEEDS_WRITE'
        env:
          APP_TOKEN: ${{ steps.app_write_token.outputs.token }}
        run: |
          set -u
          if remove_http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: token ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}/labels/agent%3Aready"); then
            remove_curl_status=0
          else
            remove_curl_status=$?
          fi
          unset APP_TOKEN

          if [ "$remove_curl_status" -ne 0 ]; then
            echo "reason_code=WRITE_PARTIAL" >> "$GITHUB_OUTPUT"
            echo "::error::remove label APIの通信に失敗しました(reason_code=WRITE_PARTIAL)"
            exit 1
          fi

          if line=$(python -m scripts.controller_label_writer check-remove-http-status \
            --http-status "$remove_http_code"); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::agent:ready削除に失敗しました(reason_code=${reason_code})"
            exit 1
          fi

      - name: Evaluate final state
        id: evaluate_final
        if: steps.precondition.outputs.state == 'NEEDS_WRITE'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if http_code=$(curl -sS -o issue_final.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}"); then
            curl_status=0
          else
            curl_status=$?
          fi

          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "reason_code=WRITE_PARTIAL" >> "$GITHUB_OUTPUT"
            echo "::error::最終状態取得に失敗しました(reason_code=WRITE_PARTIAL)"
            exit 1
          fi

          if line=$(python -m scripts.controller_label_writer evaluate-final-state \
            --before-response-file issue_pre_write.json \
            --after-response-file issue_final.json); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          working_present=$(echo "$line" | grep -oP 'WORKING_PRESENT=\K\S+' || echo "NA")
          ready_present=$(echo "$line" | grep -oP 'READY_PRESENT=\K\S+' || echo "NA")
          unrelated_preserved=$(echo "$line" | grep -oP 'UNRELATED_PRESERVED=\K\S+' || echo "NA")
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"
          echo "working_present=${working_present}" >> "$GITHUB_OUTPUT"
          echo "ready_present=${ready_present}" >> "$GITHUB_OUTPUT"
          echo "unrelated_preserved=${unrelated_preserved}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::最終状態が成功条件を満たしていません(reason_code=${reason_code})"
            exit 1
          fi

      - name: Publish job summary (fixed non-secret fields only)
        if: always()
        env:
          PRECONDITION_REASON: ${{ steps.precondition.outputs.reason_code }}
          PRECONDITION_STATE: ${{ steps.precondition.outputs.state }}
          BEFORE_READY: ${{ steps.precondition.outputs.before_ready }}
          BEFORE_WORKING: ${{ steps.precondition.outputs.before_working }}
          PLAN_REASON: ${{ steps.check_plan.outputs.reason_code }}
          LABEL_REASON: ${{ steps.check_repo_label.outputs.reason_code }}
          STATE_REASON: ${{ steps.check_state_unchanged.outputs.reason_code }}
          TOKEN_OUTCOME: ${{ steps.app_write_token.outcome }}
          ADD_VERIFY_REASON: ${{ steps.add_and_verify.outputs.reason_code }}
          REMOVE_REASON: ${{ steps.remove_label.outputs.reason_code }}
          FINAL_REASON: ${{ steps.evaluate_final.outputs.reason_code }}
          FINAL_WORKING_PRESENT: ${{ steps.evaluate_final.outputs.working_present }}
          FINAL_READY_PRESENT: ${{ steps.evaluate_final.outputs.ready_present }}
          FINAL_UNRELATED_PRESERVED: ${{ steps.evaluate_final.outputs.unrelated_preserved }}
        run: |
          token_reason="NONE"
          if [ "${TOKEN_OUTCOME:-}" = "failure" ]; then
            token_reason="AUTH_TOKEN_FAILED"
          fi

          write_outcome="NONE"
          for candidate in \
            "${PRECONDITION_REASON:-}" \
            "${PLAN_REASON:-}" \
            "${LABEL_REASON:-}" \
            "${STATE_REASON:-}" \
            "$token_reason" \
            "${ADD_VERIFY_REASON:-}" \
            "${REMOVE_REASON:-}" \
            "${FINAL_REASON:-}"
          do
            if [ -n "$candidate" ] && [ "$candidate" != "NONE" ]; then
              write_outcome="$candidate"
              break
            fi
          done

          rm -f issue_snapshot.json issue_pre_write.json issue_after_add.json issue_final.json planner_result.json

          {
            echo "## AUTO-001-05-03-03C Controller App label write結果(writer_start)"
            echo ""
            echo "- Issue番号: ${{ needs.plan.outputs.issue_number }}"
            echo "- trigger: ${{ github.event_name }}"
            echo "- planner判定: reason_code=${PRECONDITION_REASON:-NONE} precondition_state=${PRECONDITION_STATE:-NA} plan_reason=${PLAN_REASON:-NONE}"
            echo "- write outcome: ${write_outcome}"
            echo "- 書き込み前: agent:readyあり=${BEFORE_READY:-NA} agent:workingあり=${BEFORE_WORKING:-NA}"
            echo "- add outcome: reason_code=${ADD_VERIFY_REASON:-NONE}"
            echo "- remove outcome: reason_code=${REMOVE_REASON:-NONE}"
            echo "- 最終状態: agent:workingあり=${FINAL_WORKING_PRESENT:-NA} agent:readyあり=${FINAL_READY_PRESENT:-NA} 無関係ラベル保持=${FINAL_UNRELATED_PRESERVED:-NA}"
            echo "- コメント投稿: なし"
            echo "- code/branch/PR変更: なし"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # writer_block: planがexact WOULD_BLOCK_PREFLIGHT契約を確認した場合だけ
  # 実行する。AUTO-001-05-03-03B(auto001-controller-block-check.yml)と同じ
  # 書き込み順序・reason code・managed comment契約・失敗時挙動を維持する。
  # ---------------------------------------------------------------------
  writer_block:
    needs: plan
    if: needs.plan.outputs.writer_action == 'BLOCK'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    concurrency:
      group: auto001-controller-write-${{ github.repository }}-${{ needs.plan.outputs.issue_number }}
      cancel-in-progress: false
    steps:
      - name: Verify plan/writer contract_version matches expected
        env:
          CONTRACT_VERSION_VALUE: ${{ needs.plan.outputs.contract_version }}
        run: |
          set -u
          expected="AUTO-001-05-03-03C-writer-v1"
          if [ "${CONTRACT_VERSION_VALUE:-}" != "$expected" ]; then
            echo "::error::plan jobのcontract_versionが想定外です。token生成前に停止します。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify required configuration is present
        id: config_check
        env:
          CLIENT_ID_VALUE: ${{ vars.AUTO001_CONTROLLER_APP_CLIENT_ID }}
          PRIVATE_KEY_VALUE: ${{ secrets.AUTO001_CONTROLLER_APP_PRIVATE_KEY }}
        run: |
          set -u
          client_id_present=false
          private_key_present=false
          if [ -n "${CLIENT_ID_VALUE:-}" ]; then client_id_present=true; fi
          if [ -n "${PRIVATE_KEY_VALUE:-}" ]; then private_key_present=true; fi
          unset CLIENT_ID_VALUE PRIVATE_KEY_VALUE

          if line=$(python -m scripts.controller_token_check check-config \
            --client-id-present "$client_id_present" \
            --private-key-present "$private_key_present"); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::設定検査に失敗しました(reason_code=${reason_code})"
            exit 1
          fi

      # 標準GITHUB_TOKEN(issues: read)による読み取り専用フェッチ。preflight
      # 再評価・repository label前提確認・書き込み直前確認・write後の検証は、
      # すべてこのGET専用の読み取りだけで行い、Controller App tokenは実際の
      # write API呼び出し(POST/DELETE/PATCH)にだけ渡す。
      - name: Fetch issue and comments, classify precondition
        id: precondition
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if http_code=$(curl -sS -o issue_snapshot.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}"); then
            curl_status=0
          else
            curl_status=$?
          fi
          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "state=NEEDS_WRITE" >> "$GITHUB_OUTPUT"
            echo "::error::初期Issue取得に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if http_code=$(curl -sS -o comments_snapshot.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}/comments"); then
            curl_status=0
          else
            curl_status=$?
          fi
          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "state=NEEDS_WRITE" >> "$GITHUB_OUTPUT"
            echo "::error::初期コメント取得に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if line=$(python -m scripts.controller_block_writer compute-current-errors \
            --issue-response-file issue_snapshot.json \
            --output-path current_errors.json); then
            status=0
          else
            status=$?
          fi
          echo "$line"
          if [ "$status" -ne 0 ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "state=NEEDS_WRITE" >> "$GITHUB_OUTPUT"
            echo "::error::preflight再評価に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if line=$(python -m scripts.controller_block_writer classify-precondition \
            --issue-response-file issue_snapshot.json \
            --comments-response-file comments_snapshot.json \
            --current-errors-path current_errors.json); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          state=$(echo "$line" | grep -oP 'PRECONDITION_STATE=\K\S+' || echo "NEEDS_WRITE")
          before_ready=$(echo "$line" | grep -oP 'READY_PRESENT=\K\S+' || echo "NA")
          before_blocked=$(echo "$line" | grep -oP 'BLOCKED_PRESENT=\K\S+' || echo "NA")
          comment_count=$(echo "$line" | grep -oP 'MANAGED_COMMENT_COUNT=\K\S+' || echo "NA")
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "before_ready=${before_ready}" >> "$GITHUB_OUTPUT"
          echo "before_blocked=${before_blocked}" >> "$GITHUB_OUTPUT"
          echo "comment_count=${comment_count}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::事前状態判定でwrite不可と判定されました(reason_code=${reason_code})"
            exit 1
          fi

      - name: Run planner and check exact block plan
        id: check_plan
        if: steps.precondition.outputs.state == 'NEEDS_WRITE'
        run: |
          set -u
          if line=$(python -m scripts.issue_agent_planner \
            --trigger workflow_dispatch \
            --event-json-path "$GITHUB_EVENT_PATH" \
            --issue-json-path issue_snapshot.json \
            --machine-json-path planner_result.json); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          if plan_line=$(python -m scripts.controller_block_writer check-plan \
            --planner-json-path planner_result.json); then
            plan_status=0
          else
            plan_status=$?
          fi
          echo "$plan_line"

          if [ "$status" -ne 0 ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::plannerの実行に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi
          if [ "$plan_status" -ne 0 ]; then
            reason_code=$(echo "$plan_line" | grep -oP 'REASON_CODE=\K\S+' || true)
            if [ -z "$reason_code" ]; then
              reason_code="INTERNAL_ERROR"
            fi
            echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"
            echo "::error::plannerの計画が期待するwrite planと一致しません(reason_code=${reason_code})"
            exit 1
          fi

          # writer進行条件: validate_issue_body()を直接呼び出して得たerrors
          # (current_errors.json、precondition stepで算出済み)と、plannerの
          # machine_dict.errorsが、要素数・順序・code/section/message・重複を
          # 含めて完全一致することを検証する。一致しない場合、App token生成・
          # ラベルwrite・コメントwriteのいずれも行わない。
          if match_line=$(python -m scripts.controller_block_writer check-errors-match \
            --current-errors-path current_errors.json \
            --planner-json-path planner_result.json); then
            match_status=0
          else
            match_status=$?
          fi
          echo "$match_line"

          if [ "$match_status" -ne 0 ]; then
            match_reason=$(echo "$match_line" | grep -oP 'REASON_CODE=\K\S+' || true)
            if [ -z "$match_reason" ]; then
              match_reason="PREFLIGHT_RESULT_MISMATCH"
            fi
            echo "reason_code=${match_reason}" >> "$GITHUB_OUTPUT"
            echo "::error::direct validatorとplannerのerrorsが一致しません(reason_code=${match_reason})"
            exit 1
          fi

          echo "reason_code=NONE" >> "$GITHUB_OUTPUT"

      - name: Verify repository has the agent:blocked label (read-only)
        id: check_repo_label
        if: steps.precondition.outputs.state == 'NEEDS_WRITE' || steps.precondition.outputs.state == 'COMMENT_UPDATE_REQUIRED'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/labels/agent%3Ablocked"); then
            curl_status=0
          else
            curl_status=$?
          fi

          if [ "$curl_status" -ne 0 ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::repository label確認の通信に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if line=$(python -m scripts.controller_label_writer check-repo-label-status \
            --http-status "$http_code"); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::repositoryにagent:blockedラベルが存在しません(reason_code=${reason_code})"
            exit 1
          fi

      - name: Re-fetch issue and comments immediately before write
        id: check_state_unchanged
        if: steps.precondition.outputs.state == 'NEEDS_WRITE' || steps.precondition.outputs.state == 'COMMENT_UPDATE_REQUIRED'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if http_code=$(curl -sS -o issue_pre_write.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}"); then
            curl_status=0
          else
            curl_status=$?
          fi
          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::書き込み直前確認のIssue取得に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if http_code=$(curl -sS -o comments_pre_write.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}/comments"); then
            curl_status=0
          else
            curl_status=$?
          fi
          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::書き込み直前確認のコメント取得に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if line=$(python -m scripts.controller_label_writer check-state-unchanged \
            --before-response-file issue_snapshot.json \
            --current-response-file issue_pre_write.json); then
            status=0
          else
            status=$?
          fi
          echo "$line"
          if [ "$status" -ne 0 ]; then
            reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
            if [ -z "$reason_code" ]; then
              reason_code="INTERNAL_ERROR"
            fi
            echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"
            echo "::error::planner評価時点から状態ラベルが変化しています(reason_code=${reason_code})"
            exit 1
          fi

          if comment_line=$(python -m scripts.controller_block_writer check-comment-state \
            --comments-response-file comments_pre_write.json \
            --current-errors-path current_errors.json); then
            comment_status=0
          else
            comment_status=$?
          fi
          echo "$comment_line"

          comment_reason=$(echo "$comment_line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$comment_reason" ]; then
            comment_reason="INTERNAL_ERROR"
          fi
          comment_state=$(echo "$comment_line" | grep -oP 'MANAGED_COMMENT_STATE=\K\S+' || echo "NA")
          comment_id=$(echo "$comment_line" | grep -oP 'COMMENT_ID=\K\S+' || echo "")

          if [ "$comment_status" -ne 0 ]; then
            echo "reason_code=${comment_reason}" >> "$GITHUB_OUTPUT"
            echo "::error::書き込み直前のmanaged comment再確認に失敗しました(reason_code=${comment_reason})"
            exit 1
          fi

          # NEEDS_WRITE経路ではコメントが無いことを、COMMENT_UPDATE_REQUIRED
          # 経路ではprecondition時点と同一のcomment_id・STALE状態のままである
          # ことを期待する。想定外の変化はSTATE_CHANGED_BEFORE_WRITEとする。
          expected_state="${{ steps.precondition.outputs.state }}"
          if [ "$expected_state" = "NEEDS_WRITE" ] && [ "$comment_state" != "NONE" ]; then
            echo "reason_code=STATE_CHANGED_BEFORE_WRITE" >> "$GITHUB_OUTPUT"
            echo "::error::書き込み直前にmanaged commentの状態が変化しています(reason_code=STATE_CHANGED_BEFORE_WRITE)"
            exit 1
          fi
          if [ "$expected_state" = "COMMENT_UPDATE_REQUIRED" ] && [ "$comment_state" != "STALE" ]; then
            echo "reason_code=STATE_CHANGED_BEFORE_WRITE" >> "$GITHUB_OUTPUT"
            echo "::error::書き込み直前にmanaged commentの状態が変化しています(reason_code=STATE_CHANGED_BEFORE_WRITE)"
            exit 1
          fi

          echo "reason_code=NONE" >> "$GITHUB_OUTPUT"
          echo "comment_action=$([ "$comment_state" = "NONE" ] && echo CREATE || echo UPDATE)" >> "$GITHUB_OUTPUT"
          echo "comment_id=${comment_id}" >> "$GITHUB_OUTPUT"

      # AC対応: 対象repositoryだけに限定し、Issues: writeだけを要求する。
      # tokenの自動失効を無効化する入力はここでは指定しない(既定で自動失効する)。
      - name: Generate Controller App write token
        id: app_write_token
        if: steps.precondition.outputs.state == 'NEEDS_WRITE' || steps.precondition.outputs.state == 'COMMENT_UPDATE_REQUIRED'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO001_CONTROLLER_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO001_CONTROLLER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Add agent:blocked label and verify
        id: add_and_verify
        if: steps.precondition.outputs.state == 'NEEDS_WRITE'
        env:
          APP_TOKEN: ${{ steps.app_write_token.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if add_http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: token ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"labels":["agent:blocked"]}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}/labels"); then
            add_curl_status=0
          else
            add_curl_status=$?
          fi
          unset APP_TOKEN

          if [ "$add_curl_status" -ne 0 ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::add label APIの通信に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if add_line=$(python -m scripts.controller_block_writer check-add-blocked-http-status \
            --http-status "$add_http_code"); then
            add_status=0
          else
            add_status=$?
          fi
          echo "$add_line"

          if [ "$add_status" -ne 0 ]; then
            add_reason=$(echo "$add_line" | grep -oP 'REASON_CODE=\K\S+' || true)
            if [ -z "$add_reason" ]; then
              add_reason="WRITE_ADD_BLOCKED_FAILED"
            fi
            echo "reason_code=${add_reason}" >> "$GITHUB_OUTPUT"
            echo "::error::agent:blocked追加に失敗しました(reason_code=${add_reason})"
            exit 1
          fi

          if verify_http_code=$(curl -sS -o issue_after_add.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}"); then
            verify_curl_status=0
          else
            verify_curl_status=$?
          fi

          if [ "$verify_curl_status" -ne 0 ] || [ "$verify_http_code" != "200" ]; then
            echo "reason_code=WRITE_VERIFICATION_FAILED" >> "$GITHUB_OUTPUT"
            echo "::error::add後の再取得に失敗しました(reason_code=WRITE_VERIFICATION_FAILED)"
            exit 1
          fi

          if verify_line=$(python -m scripts.controller_block_writer verify-blocked-present \
            --response-file issue_after_add.json); then
            verify_status=0
          else
            verify_status=$?
          fi
          echo "$verify_line"

          verify_reason=$(echo "$verify_line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$verify_reason" ]; then
            verify_reason="INTERNAL_ERROR"
          fi
          echo "reason_code=${verify_reason}" >> "$GITHUB_OUTPUT"

          if [ "$verify_status" -ne 0 ]; then
            echo "::error::add後の検証に失敗しました(reason_code=${verify_reason})"
            exit 1
          fi

      - name: Create or update managed comment and verify
        id: comment_write
        if: steps.precondition.outputs.state == 'NEEDS_WRITE' || steps.precondition.outputs.state == 'COMMENT_UPDATE_REQUIRED'
        env:
          APP_TOKEN: ${{ steps.app_write_token.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if render_line=$(python -m scripts.controller_block_writer render-comment-body \
            --current-errors-path current_errors.json \
            --output-path comment_body.json); then
            render_status=0
          else
            render_status=$?
          fi
          echo "$render_line"
          if [ "$render_status" -ne 0 ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::comment本文の生成に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          comment_action="${{ steps.check_state_unchanged.outputs.comment_action }}"
          comment_id="${{ steps.check_state_unchanged.outputs.comment_id }}"

          if [ "$comment_action" = "CREATE" ]; then
            if write_http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST \
              -H "Authorization: token ${APP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d @comment_body.json \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}/comments"); then
              write_curl_status=0
            else
              write_curl_status=$?
            fi
          else
            if write_http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: token ${APP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d @comment_body.json \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/${comment_id}"); then
              write_curl_status=0
            else
              write_curl_status=$?
            fi
          fi
          unset APP_TOKEN
          rm -f comment_body.json

          if [ "$write_curl_status" -ne 0 ]; then
            echo "reason_code=INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "::error::comment write APIの通信に失敗しました(reason_code=INTERNAL_ERROR)"
            exit 1
          fi

          if [ "$comment_action" = "CREATE" ]; then
            if status_line=$(python -m scripts.controller_block_writer check-comment-create-http-status \
              --http-status "$write_http_code"); then
              write_status=0
            else
              write_status=$?
            fi
          else
            if status_line=$(python -m scripts.controller_block_writer check-comment-update-http-status \
              --http-status "$write_http_code"); then
              write_status=0
            else
              write_status=$?
            fi
          fi
          echo "$status_line"

          if [ "$write_status" -ne 0 ]; then
            write_reason=$(echo "$status_line" | grep -oP 'REASON_CODE=\K\S+' || true)
            if [ -z "$write_reason" ]; then
              write_reason="COMMENT_CREATE_FAILED"
            fi
            echo "reason_code=${write_reason}" >> "$GITHUB_OUTPUT"
            echo "::error::managed commentの書き込みに失敗しました(reason_code=${write_reason})"
            exit 1
          fi

          if verify_http_code=$(curl -sS -o comments_after_write.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}/comments"); then
            verify_curl_status=0
          else
            verify_curl_status=$?
          fi

          if [ "$verify_curl_status" -ne 0 ] || [ "$verify_http_code" != "200" ]; then
            echo "reason_code=COMMENT_VERIFICATION_FAILED" >> "$GITHUB_OUTPUT"
            echo "::error::comment書き込み後の再取得に失敗しました(reason_code=COMMENT_VERIFICATION_FAILED)"
            exit 1
          fi

          if verify_line=$(python -m scripts.controller_block_writer verify-managed-comment \
            --comments-response-file comments_after_write.json \
            --current-errors-path current_errors.json); then
            verify_status=0
          else
            verify_status=$?
          fi
          echo "$verify_line"

          verify_reason=$(echo "$verify_line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$verify_reason" ]; then
            verify_reason="INTERNAL_ERROR"
          fi
          echo "reason_code=${verify_reason}" >> "$GITHUB_OUTPUT"

          if [ "$verify_status" -ne 0 ]; then
            echo "::error::managed comment検証に失敗しました(reason_code=${verify_reason})"
            exit 1
          fi

      - name: Remove agent:ready label
        id: remove_label
        if: steps.precondition.outputs.state == 'NEEDS_WRITE'
        env:
          APP_TOKEN: ${{ steps.app_write_token.outputs.token }}
        run: |
          set -u
          if remove_http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: token ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}/labels/agent%3Aready"); then
            remove_curl_status=0
          else
            remove_curl_status=$?
          fi
          unset APP_TOKEN

          if [ "$remove_curl_status" -ne 0 ]; then
            echo "reason_code=WRITE_PARTIAL" >> "$GITHUB_OUTPUT"
            echo "::error::remove label APIの通信に失敗しました(reason_code=WRITE_PARTIAL)"
            exit 1
          fi

          if line=$(python -m scripts.controller_label_writer check-remove-http-status \
            --http-status "$remove_http_code"); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::agent:ready削除に失敗しました(reason_code=${reason_code})"
            exit 1
          fi

      - name: Evaluate final state
        id: evaluate_final
        if: steps.precondition.outputs.state == 'NEEDS_WRITE' || steps.precondition.outputs.state == 'COMMENT_UPDATE_REQUIRED'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -u
          if http_code=$(curl -sS -o issue_final.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}"); then
            curl_status=0
          else
            curl_status=$?
          fi
          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "reason_code=WRITE_PARTIAL" >> "$GITHUB_OUTPUT"
            echo "::error::最終状態取得(Issue)に失敗しました(reason_code=WRITE_PARTIAL)"
            exit 1
          fi

          if http_code=$(curl -sS -o comments_final.json -w '%{http_code}' \
            -H "Authorization: token ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.plan.outputs.issue_number }}/comments"); then
            curl_status=0
          else
            curl_status=$?
          fi
          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "reason_code=WRITE_PARTIAL" >> "$GITHUB_OUTPUT"
            echo "::error::最終状態取得(コメント)に失敗しました(reason_code=WRITE_PARTIAL)"
            exit 1
          fi

          require_transition=$([ "${{ steps.precondition.outputs.state }}" = "NEEDS_WRITE" ] && echo true || echo false)
          before_file="issue_pre_write.json"

          if line=$(python -m scripts.controller_block_writer evaluate-final-state \
            --before-response-file "$before_file" \
            --after-response-file issue_final.json \
            --after-comments-file comments_final.json \
            --current-errors-path current_errors.json \
            --require-label-transition "$require_transition"); then
            status=0
          else
            status=$?
          fi
          echo "$line"

          reason_code=$(echo "$line" | grep -oP 'REASON_CODE=\K\S+' || true)
          if [ -z "$reason_code" ]; then
            reason_code="INTERNAL_ERROR"
          fi
          blocked_present=$(echo "$line" | grep -oP 'BLOCKED_PRESENT=\K\S+' || echo "NA")
          ready_present=$(echo "$line" | grep -oP 'READY_PRESENT=\K\S+' || echo "NA")
          unrelated_preserved=$(echo "$line" | grep -oP 'UNRELATED_PRESERVED=\K\S+' || echo "NA")
          comment_ok=$(echo "$line" | grep -oP 'COMMENT_OK=\K\S+' || echo "NA")
          echo "reason_code=${reason_code}" >> "$GITHUB_OUTPUT"
          echo "blocked_present=${blocked_present}" >> "$GITHUB_OUTPUT"
          echo "ready_present=${ready_present}" >> "$GITHUB_OUTPUT"
          echo "unrelated_preserved=${unrelated_preserved}" >> "$GITHUB_OUTPUT"
          echo "comment_ok=${comment_ok}" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::最終状態が成功条件を満たしていません(reason_code=${reason_code})"
            exit 1
          fi

      - name: Publish job summary (fixed non-secret fields only)
        id: summary
        if: always()
        env:
          PRECONDITION_REASON: ${{ steps.precondition.outputs.reason_code }}
          PRECONDITION_STATE: ${{ steps.precondition.outputs.state }}
          BEFORE_READY: ${{ steps.precondition.outputs.before_ready }}
          BEFORE_BLOCKED: ${{ steps.precondition.outputs.before_blocked }}
          BEFORE_COMMENT_COUNT: ${{ steps.precondition.outputs.comment_count }}
          PLAN_REASON: ${{ steps.check_plan.outputs.reason_code }}
          LABEL_REASON: ${{ steps.check_repo_label.outputs.reason_code }}
          STATE_REASON: ${{ steps.check_state_unchanged.outputs.reason_code }}
          COMMENT_ACTION: ${{ steps.check_state_unchanged.outputs.comment_action }}
          TOKEN_OUTCOME: ${{ steps.app_write_token.outcome }}
          ADD_REASON: ${{ steps.add_and_verify.outputs.reason_code }}
          COMMENT_WRITE_REASON: ${{ steps.comment_write.outputs.reason_code }}
          REMOVE_REASON: ${{ steps.remove_label.outputs.reason_code }}
          FINAL_REASON: ${{ steps.evaluate_final.outputs.reason_code }}
          FINAL_BLOCKED: ${{ steps.evaluate_final.outputs.blocked_present }}
          FINAL_READY: ${{ steps.evaluate_final.outputs.ready_present }}
          FINAL_UNRELATED: ${{ steps.evaluate_final.outputs.unrelated_preserved }}
          FINAL_COMMENT_OK: ${{ steps.evaluate_final.outputs.comment_ok }}
        run: |
          token_reason="NONE"
          if [ "${TOKEN_OUTCOME:-}" = "failure" ]; then
            token_reason="AUTH_TOKEN_FAILED"
          fi

          write_outcome="NONE"
          for candidate in \
            "${PRECONDITION_REASON:-}" \
            "${PLAN_REASON:-}" \
            "${LABEL_REASON:-}" \
            "${STATE_REASON:-}" \
            "$token_reason" \
            "${ADD_REASON:-}" \
            "${COMMENT_WRITE_REASON:-}" \
            "${REMOVE_REASON:-}" \
            "${FINAL_REASON:-}"
          do
            if [ -n "$candidate" ] && [ "$candidate" != "NONE" ]; then
              write_outcome="$candidate"
              break
            fi
          done

          rm -f issue_snapshot.json comments_snapshot.json current_errors.json \
                issue_pre_write.json comments_pre_write.json issue_after_add.json \
                comment_body.json comments_after_write.json \
                planner_result.json issue_final.json comments_final.json

          {
            echo "## AUTO-001-05-03-03C Controller App block/comment write結果(writer_block)"
            echo ""
            echo "- Issue番号: ${{ needs.plan.outputs.issue_number }}"
            echo "- trigger: ${{ github.event_name }}"
            echo "- planner判定: reason_code=${PRECONDITION_REASON:-NONE} precondition_state=${PRECONDITION_STATE:-NA} plan_reason=${PLAN_REASON:-NONE}"
            echo "- write outcome: ${write_outcome}"
            echo "- 書き込み前: agent:readyあり=${BEFORE_READY:-NA} agent:blockedあり=${BEFORE_BLOCKED:-NA} managed comment件数=${BEFORE_COMMENT_COUNT:-NA}"
            echo "- comment action: ${COMMENT_ACTION:-NA}"
            echo "- blocked add outcome: reason_code=${ADD_REASON:-NONE}"
            echo "- comment write outcome: reason_code=${COMMENT_WRITE_REASON:-NONE}"
            echo "- ready remove outcome: reason_code=${REMOVE_REASON:-NONE}"
            echo "- 最終状態: agent:blockedあり=${FINAL_BLOCKED:-NA} agent:readyあり=${FINAL_READY:-NA} 無関係ラベル保持=${FINAL_UNRELATED:-NA} managed comment一致=${FINAL_COMMENT_OK:-NA}"
            echo "- code/branch/PR変更: なし"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
