<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eigo-radio｜学習項目選定</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#222;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;padding:20px}.panel{background:white;border:1px solid #dfe3e8;border-radius:16px;max-width:820px;margin:auto;padding:20px}h1{font-size:19px;margin:0 0 4px}.muted,.hint{color:#68717b;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.stat{border:1px solid #edf0f3;background:#f3f5f7;border-radius:10px;padding:10px;text-align:center;font-size:12px}.stat strong{font-size:18px;display:block;margin:4px}.stat.full{background:#dff3e9;border-color:#249361}.group{background:#f0f2f5;padding:7px 9px;font-size:12px;font-weight:700;border-radius:6px;margin:12px 0 5px}.head,.item{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,52px);align-items:center;gap:4px;padding:9px 4px;border-bottom:1px solid #eee}.head{text-align:center;font-size:13px;font-weight:700}.item label{overflow-wrap:anywhere;font-size:14px}.pick{text-align:center;border-radius:5px;padding:5px}.pick.chosen{background:#e0f2e9}.pick.locked{background:#f0f0f0}.pick input{width:17px;height:17px;accent-color:#217b52;cursor:pointer}.pick input:disabled{cursor:not-allowed}h2{font-size:16px;margin:24px 0 8px}.grammar{border:1px solid #dfe3e8;border-radius:10px;padding:12px;margin:9px 0}.grammar.selected{background:#f3faf6}.grammar p{font-size:14px;line-height:1.7}.grammar .sample{background:#f1f3f5;padding:9px;border-radius:6px;font-style:italic}textarea,select{font:inherit;width:100%;padding:9px;border:1px solid #cdd2d8;border-radius:8px}textarea{min-height:95px;resize:vertical}.actions{display:flex;gap:8px;margin-top:12px}button{border:1px solid #ccc;border-radius:8px;padding:12px 15px;font-weight:600;cursor:pointer;background:#fff}button.primary{background:#20272f;border-color:#20272f;color:#fff;flex:1}.warning{color:#ad4938;font-size:12px;margin-top:8px}.notice{font-size:12px;background:#fff7e3;padding:8px;border-radius:6px;margin:12px 0}@media(max-width:520px){body{padding:8px}.panel{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.head,.item{grid-template-columns:minmax(0,1fr) repeat(3,42px)}.pick{padding:4px}}
</style></head><body><main class="panel"><h1>eigo-radio｜学習項目選定</h1><div class="muted">承認フォーム参照実装｜9記事枠｜選定テスト用（Production未連携）</div>
<p><select id="article" aria-label="記事・レベルを選択"></select></p><div class="stats" id="stats"></div><div class="hint">各候補は①②③のいずれか1つだけ。①単独で3件、①＋②で5件、①＋②＋③で12件まで。</div><div id="candidates"></div>
<h2>文法解説 <span class="muted" id="grammarCount"></span></h2><div class="notice">この参照サンプルの文法2件は画面検証用の仮データです。正式運用時は記事固有の文法解説全文に置き換えてください。</div><div id="grammars"></div>
<h2>自由コメント・追加指示</h2><textarea id="comment" placeholder="例：snatch の説明を修正。別の上級単語を2件追加探索してください。"></textarea><div class="actions"><button class="primary" id="send">ChatGPTへ送信</button><button id="copy">選定結果をコピー</button></div><div class="hint">送信はChatGPTへのテキスト受渡しを試みます。サイトのブラウザや環境によって直接送信できない場合はコピーを使用。Claude・Productionへの自動反映はありません。</div><div id="status" class="warning" role="status"></div></main>
<script>
// Web移植版の参照コード。元のChatGPT内フォーム(DIL)固有ランタイムは通常のブラウザでは動作しない。
// データ構造と画面・上限制約・操作を忠実に移し、localStorage保持を追加したもの。
const DATA=[
{name:'AIの仮想の島',level:'Standard',p:['worth paying attention to','carry over','a useful card to play','take a detour','make a difference','one step ahead'],w:['Strategy','obstacle','separately','discovery']},
{name:'AIの仮想の島',level:'Advanced',p:['carry over','a useful card to play','call on','look at separately','take a detour'],w:['technique','performance','overlook','exploration']},
{name:'英国の電車マナー',level:'Standard',p:['draw a line','sound no one asked for','given written permission',"reach for one's wallet"],w:['exception','campaign','entertainment','masterpiece','carriage']},
{name:'英国の電車マナー',level:'Advanced',p:['draw a line','blanket ban','due to be shared',"reach for one's wallet",'written permission','face a fine'],w:['Uninvited','nationwide','automatically','recommendations','carriage']},
{name:'猿の手',level:'Standard',p:['back to life','to blame','take hold of','pulling free','break the silence','rise into the night'],w:['fate','funeral','scrape','twist','drag']},
{name:'猿の手',level:'Advanced',p:['accept no responsibility','pay off the house','interfere with fate','pulled free','caught in the machinery','wail of loss',"shake one's husband awake"],w:['compensation','snatch','deserted','burial']},
...Array.from({length:3},(_,i)=>({name:`記事${i+7}（未登録）`,level:'',p:[],w:[]}))];
const PLACEHOLDER_GRAMMAR=[{id:'g1',title:'過去完了形（had + 過去分詞）',body:'過去のある時点よりも前に起こった出来事を示す形です。例えば “She had left before he arrived.” では、彼が到着した時点ですでに彼女が出発していたことを表します。出来事の前後関係を明確にするために使います。',example:'She had left before he arrived.'},{id:'g2',title:'分詞による名詞の後置修飾',body:'過去分詞や現在分詞が名詞の後ろに置かれると、その名詞についての追加情報を表します。例えば “the letter written by her” は「彼女によって書かれた手紙」という意味です。長い関係詞節を簡潔に表す働きがあります。',example:'the letter written by her'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let active='5';let state={};try{state=JSON.parse(localStorage.getItem('eigo-kp-form-v3-reference')||'{}')}catch(e){};
function get(){return state[active]||(state[active]={choices:{},grammar:{},comment:''})}function save(){try{localStorage.setItem('eigo-kp-form-v3-reference',JSON.stringify(state))}catch(e){}};
function counts(){const a=Object.values(get().choices);return [1,2,3].map(n=>a.filter(v=>v===n).length)}
function allowed(term,cat){const c=counts(),old=get().choices[term]||0;if(old===cat)return true;const n=c.map((v,i)=>v+(cat===i+1?1:0)-(old===i+1?1:0));return n[0]<=3&&n[0]+n[1]<=5&&n[0]+n[1]+n[2]<=12}
function render(){const d=DATA[Number(active)],c=counts(),tot=c.reduce((a,b)=>a+b,0);document.getElementById('stats').innerHTML=[['① Key Phrase',c[0],3,c[0]===3],['①＋②',c[0]+c[1],5,c[0]+c[1]===5],['①＋②＋③',tot,12,tot===12],['文法',Object.values(get().grammar).filter(Boolean).length,2,Object.values(get().grammar).filter(Boolean).length===2]].map(x=>`<div class="stat ${x[3]?'full':''}">${x[0]}<strong>${x[1]} / ${x[2]}</strong>${x[3]?'上限到達':'選択可能'}</div>`).join('');let html='<div class="head"><span style="text-align:left">候補</span><span>①</span><span>②</span><span>③</span></div>';for(const group of [{title:'フレーズ',items:d.p},{title:'単語',items:d.w}]){html+=`<div class="group">${group.title}（${group.items.length}件）</div>`;for(const term of group.items){const now=get().choices[term]||0;html+=`<div class="item"><label>${esc(term)}</label>`;for(let cat=1;cat<=3;cat++){const ok=allowed(term,cat);html+=`<div class="pick ${now===cat?'chosen':!ok?'locked':''}"><input aria-label="${esc(term)} 区分${cat}" type="checkbox" data-term="${esc(term)}" data-cat="${cat}" ${now===cat?'checked':''} ${!ok?'disabled':''}></div>`}html+='</div>'}}document.getElementById('candidates').innerHTML=d.p.length||d.w.length?html:'<p class="muted">この記事枠の候補は未登録です。</p>';document.querySelectorAll('input[data-term]').forEach(el=>el.addEventListener('change',e=>{const t=e.target.dataset.term,k=Number(e.target.dataset.cat);if(e.target.checked&&!allowed(t,k))return;get().choices[t]=e.target.checked?k:0;save();render()}));const grams=PLACEHOLDER_GRAMMAR;const chosen=Object.values(get().grammar).filter(Boolean).length;document.getElementById('grammarCount').textContent=`${chosen}/2`;document.getElementById('grammars').innerHTML=grams.map(g=>`<div class="grammar ${get().grammar[g.id]?'selected':''}"><label><input type="checkbox" data-grammar="${g.id}" ${get().grammar[g.id]?'checked':''} ${chosen>=2&&!get().grammar[g.id]?'disabled':''}> <strong>${esc(g.title)}</strong></label><p>${esc(g.body)}</p><div class="sample">${esc(g.example)}</div></div>`).join('');document.querySelectorAll('input[data-grammar]').forEach(el=>el.addEventListener('change',e=>{get().grammar[e.target.dataset.grammar]=e.target.checked;save();render()}));document.getElementById('comment').value=get().comment||''}
function payload(){const d=DATA[Number(active)],c=counts(),groups=[1,2,3].map(cat=>[...d.p,...d.w].filter(t=>get().choices[t]===cat));return `記事: ${d.name} ${d.level}\n① Key Phrase (${c[0]}/3): ${groups[0].join(' / ')||'なし'}\n② 追加解説 (①＋②=${c[0]+c[1]}/5): ${groups[1].join(' / ')||'なし'}\n③ 本文意味表示 (累計=${c.reduce((a,b)=>a+b,0)}/12): ${groups[2].join(' / ')||'なし'}\n文法 (${Object.values(get().grammar).filter(Boolean).length}/2): ${PLACEHOLDER_GRAMMAR.filter(g=>get().grammar[g.id]).map(g=>g.title).join(' / ')||'なし'}\n自由コメント: ${get().comment||'なし'}\n※文法はUIテスト用の仮データ。正式本文ではない。未選択候補は不採用。`}
const article=document.getElementById('article');article.innerHTML=DATA.map((d,i)=>`<option value="${i}">${i+1}. ${esc(d.name)}${d.level?'｜'+d.level:''}</option>`).join('');article.value=active;article.addEventListener('change',()=>{active=article.value;render()});document.getElementById('comment').addEventListener('input',e=>{get().comment=e.target.value;save()});document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(payload());document.getElementById('status').textContent='選定結果をコピーしました。'}catch(e){document.getElementById('status').textContent='コピーできませんでした。ブラウザの権限を確認してください。'}});document.getElementById('send').addEventListener('click',()=>{const message='以下の選定内容を整理し、必要な修正指示と実装範囲を確認してください。Claude Code向け指示案を作成してください。正式Productionへの未承認変更は禁止します。\n\n'+payload();const url='https://chatgpt.com/?q='+encodeURIComponent(message);if(url.length>6000){document.getElementById('status').textContent='送信文が長いため、コピー機能をご利用ください。';return}window.open(url,'_blank','noopener,noreferrer');document.getElementById('status').textContent='ChatGPTの新しい画面を開きました。入力内容が反映されたか確認してください。未送信の場合はコピーをご利用ください。'});render();
</script></body></html>
