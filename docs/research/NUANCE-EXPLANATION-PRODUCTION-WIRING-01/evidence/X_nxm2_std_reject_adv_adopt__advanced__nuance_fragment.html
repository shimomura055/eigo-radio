<section class='study'><h3>ニュアンス解説</h3><div class='study-item'><h4>Still</h4><dl><dt>ポイント</dt><dd>時間の「まだ」ではなく、前の内容を受けた「それでも」</dd><dt>解説</dt><dd><p>このStillは「まだ」ではなく、前に述べたことを受けて「それでも」と話をつなぐ語です。ここでは、比較した数値の条件や調べ方が異なると断ったうえで、それでも差が不可解だと述べています。たとえば「The Moon is still warm.」なら時間的な「月はまだ暖かい」ですが、この文では前の説明との対比が中心です。</p></dd><dt>本文の英文</dt><dd>Still, the difference is puzzling.</dd><dt>日本語訳</dt><dd>それでも、その違いは謎のままです。</dd></dl></div></section>
