<section class='study'><h3>ニュアンス解説</h3><div class='study-item'><h4>even</h4><dl><dt>ポイント</dt><dd>発言さえ許さないことへの非難を強める</dd><dt>解説</dt><dd><p>ここでの even は「さえ」と訳せますが、単に話す許可がないと述べるのではなく、「話すことは最低限認められてもよさそうなのに、それすら許さない」という非難を加えます。even を外した “You won’t let them speak.” なら、事実の指摘に寄り、憤りの強さが弱まります。</p></dd><dt>本文の英文</dt><dd>You won’t even let them speak.</dd><dt>日本語訳</dt><dd>彼らには、話すことさえ許さないのか。</dd></dl></div></section>
