<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>【DEV試作】English Your Way · 記事視聴ページ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="devbar">
 <strong>DEV試作・正式公開ページではありません</strong>
 <span class="long">記事視聴ページ Phase 2(音声連動ハイライトは次工程で統合)</span>
 <label>記事: <select id="devArticle" aria-label="DEV: 記事切替"><option value="ai_island">島はリセット(Std/Adv)</option><option value="moon">月のしわ(Advのみ・文法1件)</option></select></label>
 <span id="syncState" class="note"></span>
</div>
<div class="wrap">
 <section class="hero"><div class="eyebrow" id="eyebrow">English Your Way</div><h1 id="jaTitle">Loading…</h1><div class="sub" id="enTitle"></div></section>
 <div class="top"><div class="tabs" role="tablist" id="tabs"></div><button class="playall" id="playAll" type="button">▶ 全体を再生</button></div>
 <div id="content"><div class="card"><p>コンテンツを読み込んでいます…</p></div></div>
 <footer>DEV試作 · 効果音・ジングル・技術情報は表示していません。</footer>
</div>
<div class="bar" id="bar" role="region" aria-label="再生コントロール">
 <div class="barin">
  <div class="row1">
   <button class="pp" id="pp" type="button" aria-label="再生">▶</button>
   <div class="seekwrap">
    <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="シーク">
    <div class="times"><span id="tCur">0:00</span><span id="tTot">0:00</span></div>
   </div>
  </div>
  <div class="row2">
   <span class="now-label" id="nowLabel">全体</span>
   <span class="skips"><button type="button" id="back10" aria-label="10秒戻る">◀ 10秒</button><button type="button" id="fwd10" aria-label="10秒進む">10秒 ▶</button></span>
  </div>
 </div>
</div>
<audio id="aud" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
