ctors": ["レベル適合"], "gold": "低", "why": "C1'=低:stand upは基礎既知(④) / C2'=低:④stand upは基本", "match": true, "diff": 0, "run": "M1f_r1"}, {"id": "K011", "ord": 10, "split": "dev", "family": "Z", "level": "Advanced", "article": "melos", "article_title": "melos", "phrase": "pull someone under", "span": "pulled him under", "ja": "人を水中に引きずり込む", "sentence": "The current pulled him under", "value": "中", "reason": "本文では流れに水中へ引き込まれる意味。比喩用法もあり一定の転用性がある。", "factors": ["汎用性", "レベル適合"], "gold": "低", "why": "C1'=中:pull underは推測可だが場面特有(②) / C2'=低:①pull+underで透明、状況描写 / C3裁定(Y妥当):pull+underで透明、状況描写。低", "match": false, "diff": 1, "run": "M1f_r1"}, {"id": "K012", "ord": 11, "split": "held", "family": "X", "level": "Standard", "article": "meta_w", "article_title": "AI Pets Are Free. But Their Owners Still Have Only 24 Hours a Day", "phrase": "play with", "span": "play with it", "ja": "物を相手に遊んだり楽しんだりする", "sentence": "If you are thinking, “I’ll let my child play with it,” stop here.", "value": "低", "reason": "①「一緒に遊ぶ」と推測しやすい。②本文でも子どもがアプリで遊ぶこと。③日常的で、④対象レベルでは既知と考えやすい。", "factors": ["レベル適合"], "gold": "低", "why": "C1'=低:play withは基礎で透明(①④) / C2'=低:④play withは基本、透明", "match": true, "diff": 0, "run": "M1f_h1"}, {"id": "K013", "ord": 12, "split": "held", "family": "Z", "level": "Standard", "article": "in_a_grove", "article_title": "The Thicket", "phrase": "on silent feet", "span": "on silent feet", "ja": "足音を立てずに", "sentence": "Someone came slowly towards me on silent feet", "value": "中", "reason": "①「静かな足で」は推測しやすいが、②足音を立てずに進む定型的表現。③物語描写で使える。", "factors": ["結びつき", "汎用性"], "gold": "低", "why": "C1'=中:silent feetは推測可だが文語的な修飾句(②) / C2'=低:①構成語から透明、文学的で汎用性低 / C3裁定(X妥当):on silent feetは透明で文学的。低", "match": false, "diff": 1, "run": "M1f_h1"}, {"id": "K014", "ord": 13, "split": "dev", "family": "X", "level": "Standard", "article": "untidi", "article_title": "The Trial of “Leaving Things Out” Is Now in Session", "phrase": "help with", "span": "help with", "ja": "何かの作業や問題を手助けする", "sentence": "Ask instead, “What do const ORD={"高":2,"中":1,"低":0};

const arts=[...new Map(DATA.items.map(x=>[x.article,x.article_title])).entries()];
arts.forEach(([s,t])=>{const o=document.createElement("option");o.value=s;o.textContent=t;$("fArt").appendChild(o)});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
 const sp=$("fSplit").value,fa=$("fFam").value,lv=$("fLv").value,ar=$("fArt").value,vf=$("fVal").value,so=$("fSort").value,df=$("fDiff").checked;

 const g=new Map();L.forEach(x=>{const k=x.article+"|"+x.level;if(!g.has(k))g.set(k,[]);g.get(k).push(x)});
 let h="";

   const cls=x.match?"ok":(Math.abs(x.diff)>=2?"ng":"near");

   h+=`<div class="row"><div class="ph">${esc(x.phrase)}<small>本文: ${esc(x.span)}</small></div><div>

  }

 }
