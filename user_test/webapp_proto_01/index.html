<body>
<div id="app">
  <div id="view" role="main"></div>
</div>
<div id="mini" hidden></div>
<div id="bubble" role="dialog" aria-label="本文中の意味" hidden></div>
<div id="dock" hidden>
  <div class="capwrap" id="capwrap"><div id="jacap" class="jacap" lang="ja" aria-live="polite"></div><i class="capbar" aria-hidden="true"><b></b></i><i class="capfade" aria-hidden="true"></i></div>
  <div id="ctl" class="panel">
    <div class="seekrow"><span id="tcur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置"><span id="ttot">0:00</span></div>
    <div class="ctrl"><button type="button" class="capsw" id="capsw" aria-pressed="true" aria-label="日本語字幕 ON/OFF"><span>字幕</span><b>ON</b></button><button type="button" class="speed" id="speedbtn" aria-label="再生速度" aria-haspopup="true" aria-expanded="false">1.0x</button><button type="button" class="skip" id="back10" aria-label="10秒戻る">&minus;10</button><button type="button" class="pp" id="pp" aria-label="再生"></button><button type="button" class="skip" id="fwd10" aria-label="10秒進む">+10</button></div>
  </div>
  <div id="ratepop" role="radiogroup" aria-label="再生速度" hidden><button type="button" role="radio" data-rate="0.5" aria-checked="false">0.5x</button><button type="button" role="radio" data-rate="0.8" aria-checked="false">0.8x</button><button type="button" role="radio" data-rate="0.9" aria-checked="false">0.9x</button><button type="button" role="radio" data-rate="1" aria-checked="true">1.0x</button><button type="button" role="radio" data-rate="1.1" aria-checked="false">1.1x</button><button type="button" role="radio" data-rate="1.2" aria-checked="false">1.2x</button></div>
</div>
