<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PWA BG Audio Trial 01</title>
<link rel="stylesheet" href="trial.css">
</head>
<body>
<div class="wrap">
 <div id="variant" class="variant">Variant: ?</div>
 <div class="note">Trial専用ページ(Production非関与)。ログはlocalStorageへ逐次保存。JSが停止している間(バックグラウンド等)はログが記録されず、heartbeat(10秒毎)の欠落区間として読む。ログは端末内のみ(自動送信なし)。ログ消失の可能性: ページ破棄・Safariデータ消去・プライベートブラウズ・容量超過。</div>
 <div class="row">
  <button type="button" id="btnPlay">再生(先頭から)</button>
  <button type="button" id="btnPP">一時停止/再開</button>
  <button type="button" id="btnNext">次クリップ</button>
 </div>
 <div class="row"><label><input type="checkbox" id="chkLoop" checked> 最後まで行ったら先頭へ戻って連続再生(長時間観察用)</label></div>
 <div id="status" class="status">-</div>
 <div class="row">
  <button type="button" id="btnCopy">ログをコピー</button>
  <button type="button" id="btnShare">共有</button>
  <button type="button" id="btnDl">ダウンロード</button>
  <button type="button" id="btnMark">メモ行を追加</button>
  <button type="button" id="btnClear">ログ消去</button>
 </div>
 <div class="row"><input type="text" id="memo" placeholder="メモ(例: Podcastが再生された / 15分pause後)"></div>
 <div id="env" class="env"></div>
 <pre id="log" class="log"></pre>
 <pre id="dump" class="log dump" hidden></pre>
</div>
<audio id="aud" preload="metadata"></audio>
<script src="trial.js"></script>
</body>
</html>
